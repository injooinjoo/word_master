name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npx tsc --noEmit

      - run: npx expo-doctor

      - run: npm run check:release-config
